[workspace]
members = ["crates/core", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/aaronlockhartdev/transcodarr"

[workspace.dependencies]
transcodarr-core = { path = "crates/core" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_128"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
futures-util = "0.3"
zstd = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "symbols"
