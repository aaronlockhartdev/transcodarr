# The independent signal: the same `just check` the hook runs, on a machine
# the agent cannot reach and cannot skip with --no-verify (ADR-0001).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded push must not keep a stale verdict alive. Strict protection
# re-runs the new tip regardless, so a second runner on the same ref only
# delays the answer. `pull_request` and `push` refs differ, so a merge to
# main is never cancelled by the PR run that just landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Measured 98 s on a cold runner: check 32 s, selftest 47 s, toolchain 11 s.
    # So 15 minutes means hung, not slow. Without it a wedged run burns the
    # monthly free-minute allowance while nothing is being decided.
    #
    # No dependency caching yet. A cold `cargo build --workspace` is 4.1 s
    # locally (55 crates) and `npm ci` 0.6 s with a warm ~/.npm, so the whole
    # ceiling sits inside the 31 s `check` step. When the graph grows, add in
    # this order: ~/.npm and ~/.cargo/registry (download caches - `npm ci`
    # wipes node_modules and cargo re-resolves per Cargo.lock, so neither can
    # fake a verdict), then sccache, which keys on hashed compiler inputs.
    # Raw target/ last: cargo skips a source file whose content changed if its
    # mtime is older than the recorded fingerprint (measured). Checkout gives
    # every source a fresh mtime, which is the only reason a restored target
    # dir rebuilds instead of lying - do not rely on that for anything else.
    timeout-minutes: 15
    steps:
      # Pinned by SHA: this runs on PRs and is a FLAG path (ADR-0001).
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # node, just, gitleaks, cargo-deny at the versions pinned in mise.toml.
      # jdx/mise-action v5.3.0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78

      # Installs the channel pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show

      - name: check
        run: just check

      # A gate suite with no CI wiring is how an inert check ships green: two
      # projects were found with a passing script suite that nothing in CI ran.
      # The suite runs in a scratch repo, so it cannot interfere with the
      # checkout above.
      - name: selftest
        run: just selftest
