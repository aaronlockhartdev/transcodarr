# The independent signal: the same `just check` the hook runs, on a machine
# the agent cannot reach and cannot skip with --no-verify (ADR-0001).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded push must not keep a stale verdict alive. Strict protection
# re-runs the new tip regardless, so a second runner on the same ref only
# delays the answer. `pull_request` and `push` refs differ, so a merge to
# main is never cancelled by the PR run that just landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Measured 98 s on a cold runner: check 32 s, selftest 47 s, toolchain 11 s.
    # So 15 minutes means hung, not slow. Without it a wedged run burns the
    # monthly free-minute allowance while nothing is being decided.
    #
    # No dependency caching, deliberately: the ceiling is the 32 s `check` step,
    # Actions' cache costs restore and save time against that, and a restored
    # target dir whose mtimes make cargo consider artifacts fresh is the exact
    # failure this job exists to catch - `serving` boots whatever binary is in
    # target, so a cached artifact is a green for a build nobody made.
    timeout-minutes: 15
    steps:
      # Pinned by SHA: this runs on PRs and is a FLAG path (ADR-0001).
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # node, just, gitleaks, cargo-deny at the versions pinned in mise.toml.
      # jdx/mise-action v5.3.0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78

      # Installs the channel pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show

      - name: check
        run: just check

      # A gate suite with no CI wiring is how an inert check ships green: two
      # projects were found with a passing script suite that nothing in CI ran.
      # The suite runs in a scratch repo, so it cannot interfere with the
      # checkout above.
      - name: selftest
        run: just selftest
