# Vale reads the ADR corpus as a structure, not as prose: the required headings, and the one section
# that must never be empty. `vale test --coverage` (from `just selftest`) already runs the rules in
# `.vale/ADR/` against the cases beside them and fails when a rule has no case, so a rule that
# matches nothing cannot sit here reporting success forever. The arm that runs this over `docs` on
# every commit lands next, in the same change that moves the heading checks out of
# `scripts/check.sh`; until then the shell enforces the headings and this file is rules under test.
StylesPath = .vale
MinAlertLevel = error
Vocab = ADR

# Spelling and casing, for every Markdown file we lint. It comes FIRST on purpose: when two
# sections match one file the later one's `BasedOnStyles` is the one that holds, so the ADR
# section below has to repeat `Vale` rather than assume it.
[*.md]
BasedOnStyles = Vale

# Decision records only. The index and the research file are not ADR-shaped, and a heading rule
# over them reports the shape of a file that is not a decision record.
[docs/adr/[0-9][0-9][0-9][0-9]-*.md]
BasedOnStyles = Vale, ADR
